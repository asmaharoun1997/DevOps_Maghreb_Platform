---
- name: Préparer les nœuds pour Kubernetes
  hosts: k8s
  become: true

  tasks:
    - name: Désactiver le swap maintenant
      ansible.builtin.command: swapoff -a
      changed_when: false

    - name: Désactiver le swap au redémarrage
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '# \1'

    - name: Charger les modules noyau au démarrage
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter

    - name: Charger les modules noyau maintenant
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Régler les paramètres réseau du noyau
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        sysctl_file: /etc/sysctl.d/k8s.conf
        reload: true
      loop:
        - { name: net.bridge.bridge-nf-call-iptables, value: "1" }
        - { name: net.bridge.bridge-nf-call-ip6tables, value: "1" }
        - { name: net.ipv4.ip_forward, value: "1" }

    - name: Installer les prérequis
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true

    - name: Créer le dossier des clés de dépôts
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Télécharger la clé du dépôt Docker
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Ajouter le dépôt Docker
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Installer containerd
      ansible.builtin.apt:
        name: containerd.io
        state: present
        update_cache: true

    - name: Vérifier si containerd est déjà configuré
      ansible.builtin.command: grep -q "SystemdCgroup = true" /etc/containerd/config.toml
      register: cgroup_check
      failed_when: false
      changed_when: false

    - name: Générer la configuration par défaut de containerd
      ansible.builtin.shell: containerd config default > /etc/containerd/config.toml
      when: cgroup_check.rc != 0

    - name: Utiliser systemd pour la gestion des cgroups
      ansible.builtin.replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        replace: 'SystemdCgroup = true'
      notify: Redémarrer containerd

    - name: Activer et démarrer containerd
      ansible.builtin.service:
        name: containerd
        state: started
        enabled: true

  handlers:
    - name: Redémarrer containerd
      ansible.builtin.service:
        name: containerd
        state: restarted
