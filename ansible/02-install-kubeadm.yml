---
- name: Installer kubeadm, kubelet et kubectl
  hosts: k8s
  become: true

  vars:
    k8s_minor: "v1.36"

  tasks:
    - name: Télécharger la clé du dépôt Kubernetes
      ansible.builtin.get_url:
        url: "https://pkgs.k8s.io/core:/stable:/{{ k8s_minor }}/deb/Release.key"
        dest: /etc/apt/keyrings/kubernetes.asc
        mode: "0644"

    - name: Ajouter le dépôt Kubernetes
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes.asc] https://pkgs.k8s.io/core:/stable:/{{ k8s_minor }}/deb/ /"
        filename: kubernetes
        state: present

    - name: Installer kubelet, kubeadm et kubectl
      ansible.builtin.apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        update_cache: true

    - name: Bloquer les versions de ces paquets
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

    - name: Activer kubelet au démarrage
      ansible.builtin.service:
        name: kubelet
        enabled: true
